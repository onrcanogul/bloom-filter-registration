spring.application.name=bloom-registration
server.port=8080

spring.datasource.url=jdbc:h2:mem:users;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# In-memory H2 answers in microseconds; a real networked database needs a round trip.
# This latency is added to every username lookup so the demo reflects a remote DB.
app.db.simulated-latency-micros=1000

# Mock data loaded at startup (0 disables seeding)
app.seed.user-count=200000
app.seed.random-seed=42

# Bloom filter sizing: capacity before the false positive rate starts to degrade
app.bloom.expected-insertions=500000
app.bloom.false-positive-rate=0.01
